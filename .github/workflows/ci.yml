# SRS §17.6.2: every push/PR builds and tests automatically; a failing test
# blocks the merge. Backend tests run against Postgres (the production
# database), with the demo seed loaded by tests/conftest.py.
name: CI

on:
  push:
    branches: [main]
  pull_request:

jobs:
  backend:
    runs-on: ubuntu-latest
    services:
      postgres:
        image: postgres:16
        env:
          POSTGRES_USER: rdip
          POSTGRES_PASSWORD: rdip
          POSTGRES_DB: rdip_test
        ports: ["5432:5432"]
        options: >-
          --health-cmd "pg_isready -U rdip"
          --health-interval 5s --health-timeout 5s --health-retries 10
    defaults:
      run:
        working-directory: backend
    env:
      DATABASE_URL: postgresql://rdip:rdip@localhost:5432/rdip_test
      STORAGE_BACKEND: local
      LOCAL_STORAGE_DIR: ${{ runner.temp }}/rdip-storage
      RATE_LIMIT_ENABLED: "false"
      JWT_SECRET: ci-only-secret
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"
          cache: pip
          cache-dependency-path: backend/requirements*.txt
      - run: pip install -r requirements-dev.txt
      # SRS §22: ≥ 80% coverage of the service layer and validation rules.
      - run: python -m pytest --cov=app --cov-report=term --cov-fail-under=80

  frontend:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: "22"
          cache: npm
      - run: npm ci
      - run: npx tsc --noEmit
      - run: npm run lint
      - run: npm run build
